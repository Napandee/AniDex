services:
  anime-tracker:
    # Replace with your image, e.g. ghcr.io/yourusername/anime-tracker:latest
    # or build locally: image: anime-tracker:local
    image: ghcr.io/yourusername/anime-tracker:latest
    container_name: anime-tracker
    restart: unless-stopped
    ports:
      - "8888:8888"
    env_file:
      - /path/to/your/.env
