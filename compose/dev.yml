# Local dev/test stack — NOT the deploy mechanism (see anidex.yml/anidex-postgres.yml
# for that). This builds the app image from the local Dockerfile instead of pulling
# from GHCR. See README's "Local development & pre-merge testing" section for the full
# workflow: up → register → seed → test in browser → down -v.
#
# Host ports are auto-assigned (not fixed) and this file is always run with a
# project name scoped to the current checkout — use scripts/dev/up.sh and
# scripts/dev/down.sh rather than invoking compose directly. Two worktrees/sessions
# running this stack at once used to collide on shared fixed container names/ports
# (compose_anidex-dev-postgres_1 / :28888), silently tearing down each other's
# containers and wiping the throwaway Postgres volume — this fixes that.
services:
  anidex-dev-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: anime_tracker
      POSTGRES_USER: anime_tracker
      POSTGRES_PASSWORD: devpass
    ports:
      - "5432"
    volumes:
      - ../schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anime_tracker"]
      interval: 2s
      timeout: 3s
      retries: 20

  anidex-dev:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      anidex-dev-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://anime_tracker:devpass@anidex-dev-postgres:5432/anime_tracker
      SESSION_SECRET_KEY: dev-only-not-for-real-use
      TZ: UTC
      # Skips the live AniList push in rating/status/progress — see app/main.py's
      # ANILIST_MOCK. Lets those endpoints be exercised locally with no real AniList
      # account/token. Never set this outside this dev-only compose file.
      ANILIST_MOCK: "1"
    ports:
      - "8888"
