# Local dev/test stack — NOT the deploy mechanism (see anidex.yml/anidex-postgres.yml
# for that). This builds the app image from the local Dockerfile instead of pulling
# from GHCR, and uses ports distinct from the documented live-instance ports
# (8889 / 5433, see CLAUDE.local.md) so it can run alongside a real deploy on the same
# machine. See README's "Local development & pre-merge testing" section for the full
# workflow: up → register → seed → test in browser → down -v.
#
# Works with either `docker compose -f compose/dev.yml up --build` or
# `podman compose -f compose/dev.yml up --build`.
services:
  anidex-dev-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: anime_tracker
      POSTGRES_USER: anime_tracker
      POSTGRES_PASSWORD: devpass
    ports:
      - "25432:5432"
    volumes:
      - ../schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anime_tracker"]
      interval: 2s
      timeout: 3s
      retries: 20

  anidex-dev:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      anidex-dev-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://anime_tracker:devpass@anidex-dev-postgres:5432/anime_tracker
      SESSION_SECRET_KEY: dev-only-not-for-real-use
      TZ: UTC
      # Skips the live AniList push in rating/status/progress — see app/main.py's
      # ANILIST_MOCK. Lets those endpoints be exercised locally with no real AniList
      # account/token. Never set this outside this dev-only compose file.
      ANILIST_MOCK: "1"
    ports:
      - "28888:8888"
