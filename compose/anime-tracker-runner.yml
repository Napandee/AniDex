services:
  anime-tracker-runner:
    image: myoung34/github-runner:latest
    container_name: anime-tracker-runner
    restart: unless-stopped
    env_file:
      - ***REDACTED-PATH***/anime-tracker/.runner.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ***REDACTED-PATH***/anime-tracker:***REDACTED-PATH***/anime-tracker:ro
