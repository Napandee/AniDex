# Optional bundled convenience, not required infrastructure — this stands up a
# dedicated Postgres purely for AniDex's own use. If you already run a shared
# Postgres instance for other apps, you can skip this file entirely: create a
# dedicated database/role for AniDex inside your existing instance instead and
# point `compose/anidex.yml`'s DATABASE_URL at it. `app/db.py` has no assumption
# baked in about which Postgres instance/host DATABASE_URL points to. See
# docs/admin/shared-postgres.md for the full walkthrough (issue #496).
services:
  anidex-postgres:
    image: postgres:16-alpine
    container_name: anidex-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: anime_tracker
      POSTGRES_USER: anime_tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
