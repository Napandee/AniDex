name: Build anidex

# Builds and pushes ghcr.io/<owner>/anidex:<sha> only. :latest and the semver
# tags move only in release.yml, so merging to main does not deploy anything.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'compose/**'
      - '**.md'
      - '.claude/**'
      - '.github/dependabot.yml'
      - '.github/workflows/pr-validate.yml'
      - '.github/workflows/notify-dependabot.yml'

concurrency:
  group: build-deploy-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER }}/anidex:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}

