name: Build and deploy anidex

on:
  push:
    branches: [main]
    paths-ignore:
      - 'compose/**'
      - '**.md'
      - '.claude/**'
      - '.github/dependabot.yml'
      - '.github/workflows/pr-validate.yml'
      - '.github/workflows/notify-dependabot.yml'

concurrency:
  group: build-deploy-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER }}/anidex:latest
          build-args: |
            GIT_SHA=${{ github.sha }}

  deploy:
    needs: build
    runs-on: [self-hosted, unraid]

    steps:
      - name: Log in to GHCR
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          GHCR_TOKEN=$(grep '^GHCR_TOKEN=' ${{ vars.APPDATA_PATH }}/.env | cut -d= -f2- | tr -d '\r\n')
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$OWNER" --password-stdin

      - name: Pull new image by digest
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          docker pull ghcr.io/$OWNER/anidex@${{ needs.build.outputs.digest }}

      - name: Restart container
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          docker stop anidex 2>/dev/null || true
          docker rm   anidex 2>/dev/null || true
          docker run -d \
            --name anidex \
            --restart unless-stopped \
            -p 8889:8888 \
            --env-file ${{ vars.APPDATA_PATH }}/.env \
            ghcr.io/$OWNER/anidex@${{ needs.build.outputs.digest }}
