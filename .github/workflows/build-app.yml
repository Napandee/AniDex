name: Build and deploy anime-tracker

on:
  push:
    branches: [main]
    paths-ignore:
      - 'Dockerfile.crunchysync'
      - 'requirements-crunchysync.txt'
      - 'scripts/sync_crunchyroll.py'
      - 'scripts/sync_anilist.py'
      - 'scripts/run_recommender.py'
      - 'scripts/crunchysync-entrypoint.sh'
      - 'compose/**'
      - '**.md'
      - '.claude/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/napandee/anime-tracker:latest

      # Deploy is triggered separately via GitHub push webhook → n8n → deploy.sh
      # n8n waits 5 minutes after the push before pulling from GHCR to ensure the build is complete
