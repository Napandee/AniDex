name: Build and deploy anime-tracker

on:
  push:
    branches: [main]
    paths-ignore:
      - 'Dockerfile.crunchysync'
      - 'requirements-crunchysync.txt'
      - 'scripts/sync_crunchyroll.py'
      - 'scripts/sync_anilist.py'
      - 'scripts/run_recommender.py'
      - 'scripts/crunchysync-entrypoint.sh'
      - 'compose/**'
      - '**.md'
      - '.claude/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/napandee/anime-tracker:latest

  deploy:
    needs: build
    runs-on: [self-hosted, unraid]

    steps:
      - name: Log in to GHCR
        run: |
          GHCR_TOKEN=$(grep '^GHCR_TOKEN=' ***REDACTED-PATH***/anime-tracker/.env | cut -d= -f2- | tr -d '\r\n')
          echo "$GHCR_TOKEN" | docker login ghcr.io -u Napandee --password-stdin

      - name: Pull new image
        run: docker pull ghcr.io/napandee/anime-tracker:latest

      - name: Restart container
        run: |
          docker stop anime-tracker 2>/dev/null || true
          docker rm   anime-tracker 2>/dev/null || true
          docker run -d \
            --name anime-tracker \
            --restart unless-stopped \
            -p 8889:8888 \
            --env-file ***REDACTED-PATH***/anime-tracker/.env \
            ghcr.io/napandee/anime-tracker:latest
