name: Release

# Deliberate release: computes the next semver from the v* tags, builds once,
# scans with Trivy (fails on fixable HIGH/CRITICAL), pushes the semver image
# tags, tags the commit and creates the GitHub release. This is the only path
# that moves :latest (build-app.yml pushes :<sha> only). After publish: `demo`
# builds and checks the static demo of the same commit (demo.yml), `screenshots`
# attaches anidex-{hero,desktop,mobile}.jpg to the release, and `pages` deploys
# the demo to GitHub Pages (Pages source must be "GitHub Actions").
# Note: :latest moves before the tag and release are created; if those steps
# fail, recovery is manual.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        required: true
        options: [patch, minor, major]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Refuse unless running on main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases run from main only (got ${GITHUB_REF})"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Refuse if HEAD already carries a release tag
        run: |
          existing=$(git tag --points-at HEAD --list 'v*')
          if [ -n "$existing" ]; then
            echo "::error::HEAD already carries ${existing}; use 'Re-run failed jobs' on that release run instead of starting a new one"
            exit 1
          fi

      - name: Compute version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          git fetch --tags --force origin
          version=$(python3 scripts/release/next_version.py "$BUMP")
          {
            echo "version=${version}"
            echo "minor=${version%.*}"
            echo "major=${version%%.*}"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing v${version}"

      - name: Refuse if the tag already exists on the remote
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag v${VERSION} already exists on the remote"
            exit 1
          fi

      - name: Set lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (load for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: anidex:scan
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ github.sha }}

      - name: Trivy scan (fails on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: anidex:scan
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Push release image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ env.OWNER }}/anidex:${{ steps.version.outputs.version }}
            ghcr.io/${{ env.OWNER }}/anidex:${{ steps.version.outputs.minor }}
            ghcr.io/${{ env.OWNER }}/anidex:${{ steps.version.outputs.major }}
            ghcr.io/${{ env.OWNER }}/anidex:latest
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ github.sha }}

      - name: Tag and create the GitHub release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "v${VERSION}"
          git push origin "refs/tags/v${VERSION}"
          gh release create "v${VERSION}" --generate-notes --title "v${VERSION}" --verify-tag

  # The static demo of the released commit: demo.yml builds it from github.sha
  # (the commit publish just tagged), runs its tests, site check and layout audit,
  # and uploads `demo-site`.
  demo:
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/demo.yml

  screenshots:
    needs: [publish, demo]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      ENGINE: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download demo-site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: demo-site
          path: _site

      # Same install as demo/build.sh: browsers come from the pinned image.
      - name: Install demo dependencies
        run: |
          docker run --rm -v "$PWD/demo:/w" -w /w -e PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 \
            mcr.microsoft.com/playwright:v1.64.1-noble npm ci --no-audit --no-fund --loglevel=error

      - name: Capture screenshots
        run: sh demo/run.sh capture _site shots

      - name: Attach screenshots to the release
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${VERSION}" shots/anidex-hero.jpg shots/anidex-desktop.jpg shots/anidex-mobile.jpg --clobber

  pages:
    needs: demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download demo-site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: demo-site
          path: _site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
