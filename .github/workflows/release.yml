name: Release

# Deliberate release: run by hand with a patch/minor/major bump. Everything —
# version, Trivy-gated image, tags, release notes, demo, screenshots, Pages —
# is done by the shared workflow; see Napandee/standard-workflows README.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        required: true
        options: [patch, minor, major]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      packages: write
      pages: write
      id-token: write
    uses: Napandee/standard-workflows/.github/workflows/release.yml@v1
    with:
      bump: ${{ inputs.bump }}
      demo-test-command: docker run --rm -v "$PWD:/w" -w /w node:22-alpine node --test 'tests/demo/*.test.mjs'
