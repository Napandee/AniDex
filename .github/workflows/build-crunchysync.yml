name: Build anidex-crunchysync

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.crunchysync'
      - 'requirements-crunchysync.txt'
      - 'scripts/sync_crunchyroll.py'
      - 'scripts/sync_anilist.py'
      - 'scripts/run_recommender.py'
      - 'scripts/crunchysync-entrypoint.sh'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.crunchysync
          push: true
          tags: ghcr.io/${{ env.OWNER }}/anidex-crunchysync:latest
