name: Demo

# Builds the fake-data demo and runs its checks on pull requests, through the
# shared workflow (Napandee/standard-workflows). The recorder, seed and config
# are AniDex's own; the kit, check and audit are shared.
on:
  pull_request:
    paths:
      - app/**
      - demo/**
      - tests/demo/**
      - schema.sql
      - migrations/**
      - Dockerfile
      - requirements*.txt
      - .github/workflows/demo.yml

permissions:
  contents: read

concurrency:
  group: demo-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  demo:
    permissions:
      contents: read
    uses: Napandee/standard-workflows/.github/workflows/demo.yml@v1
    with:
      test-command: docker run --rm -v "$PWD:/w" -w /w node:22-alpine node --test 'tests/demo/*.test.mjs'
