name: Security scan

# Weekly Trivy scan of the app image (fixable HIGH/CRITICAL only), plus on pull
# requests that change what goes into the image. Report only: findings never fail
# this workflow (release.yml is the gate that fails on them). Results are in the
# job log and in the `trivy-report` artifact (SARIF).

on:
  schedule:
    - cron: "0 5 * * 1" # Monday 05:00 UTC
  pull_request:
    paths:
      - Dockerfile
      - requirements*.txt
      - .github/workflows/security.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (load for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: anidex:scan

      - name: Trivy scan (table, report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: anidex:scan
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Trivy scan (SARIF, report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: anidex:scan
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          skip-setup-trivy: true

      - name: Upload trivy-report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-report
          path: trivy-results.sarif
          if-no-files-found: warn
          retention-days: 30
