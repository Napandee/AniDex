name: Security scan

# Weekly and on dependency changes: Trivy report of fixable HIGH/CRITICAL
# findings (report only; the Release workflow is the gate). Shared workflow:
# Napandee/standard-workflows security-scan.yml.
on:
  schedule:
    - cron: "0 5 * * 1" # Monday 05:00 UTC
  pull_request:
    paths:
      - Dockerfile
      - requirements*.txt
      - .github/workflows/security.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    permissions:
      contents: read
    uses: Napandee/standard-workflows/.github/workflows/security-scan.yml@v1
