name: Validate PR build

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'compose/**'
      - '**.md'
      - '.claude/**'
      - '.github/dependabot.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: anidex_test
          POSTGRES_USER: anidex_test
          POSTGRES_PASSWORD: anidex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anidex_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      # Issue #474 — this used to be a non-blocking ::warning:: only (#380):
      # schema migrations in this repo are a deliberate manual step (CLAUDE.md's
      # "Schema migrations are manual" guardrail), never auto-applied by the
      # deploy pipeline, so a merged PR that adds one can silently sit unapplied
      # on production with nobody aware — confirmed live twice (2026-08-27:
      # migrations/028_plex_sync_state.sql; and again with #485's migration 044,
      # applied by hand after merge on 2026-09-03). A warning at PR time wasn't
      # enough to stop that from happening even once it existed, so this now
      # actually FAILS the build when a new migrations/ file lands without a
      # LATEST_MIGRATION bump in the same diff — the authoring-time half of
      # #474's fix. The runtime half is app/main.py's _nav_context computing
      # nav_migration_drift (admin-only), rendered as a persistent banner on
      # every page via base.html — Admin > Instance Health (#380) remains the
      # detail view, this is the "can't miss it regardless of which page you're
      # on" surface on top of it.
      #
      # Deliberately only checks that the LATEST_MIGRATION line changed at all,
      # not that it changed to a specific "correct" number — matching #474's
      # literal scope and avoiding a cleverer check's own false-positive risk.
      # Never fires on a PR that only modifies an existing migration file's
      # contents (--diff-filter=A only matches newly-added files) or one that
      # doesn't touch migrations/ at all.
      - name: Require LATEST_MIGRATION bump alongside a new migration file
        run: |
          git fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          new_migrations=$(git diff --diff-filter=A --name-only "${{ github.event.pull_request.base.sha }}" HEAD -- migrations/ || true)
          if [ -z "$new_migrations" ]; then
            exit 0
          fi
          bumped=$(git diff "${{ github.event.pull_request.base.sha }}" HEAD -- app/main.py | grep -E '^[+-]LATEST_MIGRATION = ' || true)
          if [ -z "$bumped" ]; then
            echo "::error::This PR adds a database migration (new file(s): $(echo "$new_migrations" | tr '\n' ' ')) but app/main.py's LATEST_MIGRATION constant wasn't changed in the same diff. Bump it to match before this can merge — Admin > Instance Health and every page's admin drift banner (#474) compare against it to detect schema/code mismatch on the live instance."
            exit 1
          fi
          echo "::notice::New migration file(s) detected ($(echo "$new_migrations" | tr '\n' ' ')) and LATEST_MIGRATION was bumped in the same diff — looks correct. Remember: migrations are NOT applied automatically on deploy (schema migrations are a manual step, see CLAUDE.md). Run scripts/mark_migration_applied.sh <N> against production by hand after merging."

      # load: true (not push) makes the image available to `docker run` in this job,
      # without touching GHCR — this is PR validation, not the deploy path.
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: anidex:pr-test

      - name: Apply schema to test database
        run: |
          PGPASSWORD=anidex_test psql -h localhost -U anidex_test -d anidex_test -f schema.sql

      # Boots the real built image against a real Postgres and hits a route that
      # actually renders via templates.TemplateResponse (GET /auth/login) — a bare
      # `docker build` success proves dependencies resolve, nothing more. See
      # CLAUDE.local.md's dependency-review lesson: the 2026-08-13 fastapi/starlette
      # outage passed CI and a manual smoke test because that manual test hit a route
      # nobody had confirmed touched Jinja. This step checks both the HTTP status and
      # the actual rendered body, so a broken TemplateResponse calling convention
      # fails the check instead of silently passing on a 200 from somewhere else.
      #
      # `-L` follows the redirect: on a fresh empty DB (as here), GET /auth/login
      # 303s to /auth/register since there's no admin yet — both templates share
      # the `auth-title` class, so the content check holds regardless of which one
      # the app lands on. Both routes render via templates.TemplateResponse
      # (app/main.py:688 and :746 respectively) — auth-title only exists in the
      # Jinja source, never in main.py, so this can't pass on hand-built HTML.
      - name: Smoke-test the built image
        run: |
          docker run -d --name anidex-smoke --network host \
            -e DATABASE_URL="postgresql://anidex_test:anidex_test@localhost:5432/anidex_test" \
            -e SESSION_SECRET_KEY="ci-smoke-test-key" \
            -e SETTINGS_ENCRYPTION_KEY="MJ9Jy26ApKWYaavzvVpYqIB8LcPSRs_hXn7PIsyC6fk=" \
            anidex:pr-test

          ok=""
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8888/auth/login; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "App never became reachable on :8888"
            docker logs anidex-smoke
            exit 1
          fi

          status=$(curl -sL -o /tmp/login.html -w '%{http_code}' http://localhost:8888/auth/login)
          if [ "$status" != "200" ]; then
            echo "GET /auth/login (following redirects) returned $status, expected 200"
            docker logs anidex-smoke
            exit 1
          fi
          if ! grep -q 'auth-title' /tmp/login.html; then
            echo "Response body doesn't match a rendered auth template — Jinja rendering may be broken"
            cat /tmp/login.html
            docker logs anidex-smoke
            exit 1
          fi
          echo "Smoke test passed: auth page rendered correctly."

      # Issue #379 — the check above only proves an UNauthenticated route renders;
      # issue #50 (which added it) already flagged that a break in an authenticated
      # route or a POST handler would slip straight through. This seeds a real local
      # user (bcrypt-hashed via the already-built image itself, so this never invents
      # a second hashing path that could drift from the app's own bcrypt pin) so the
      # next step can log in for real.
      - name: Seed a local test user for authenticated smoke checks
        run: |
          hash=$(docker run --rm anidex:pr-test python3 -c \
            "import bcrypt; print(bcrypt.hashpw(b'ci-smoke-test-password', bcrypt.gensalt()).decode())")
          PGPASSWORD=anidex_test psql -h localhost -U anidex_test -d anidex_test -c \
            "INSERT INTO users (auth_provider, auth_provider_id, email, password_hash, is_admin, last_login_at)
             VALUES ('local', 'smoketest@ci.local', 'smoketest@ci.local', '$hash', false, now());"

      # A real login, a real authenticated templates.TemplateResponse route (the
      # library page, rendering actual user data — not the pre-login auth template
      # the check above already covers), and a real CSRF-protected POST write, all
      # exercised against the built image end to end. /settings/display was picked
      # for the POST check specifically because it only ever touches the local
      # `settings` table (config.set_value) — no AniList call, no outbound network,
      # safe to run unattended in CI.
      - name: Smoke-test an authenticated route and a POST handler
        run: |
          cookiejar=$(mktemp)

          # Anonymous GET first — issues the session cookie and this session's CSRF
          # token (app/csrf.py's get_or_create_token runs on every TemplateResponse
          # render, including pre-login; embedded as <meta name="csrf-token">, see
          # app/templates/base.html).
          curl -sL -c "$cookiejar" -b "$cookiejar" -o /tmp/pre-login.html http://localhost:8888/auth/login
          csrf=$(grep -o 'name="csrf-token" content="[^"]*"' /tmp/pre-login.html | sed 's/.*content="//;s/"$//')
          if [ -z "$csrf" ]; then
            echo "Could not extract a CSRF token from /auth/login"
            docker logs anidex-smoke
            exit 1
          fi

          status=$(curl -sL -c "$cookiejar" -b "$cookiejar" -o /tmp/home.html -w '%{http_code}' \
            -d "email=smoketest@ci.local" -d "password=ci-smoke-test-password" -d "csrf_token=$csrf" \
            http://localhost:8888/auth/login)
          if [ "$status" != "200" ]; then
            echo "POST /auth/login (following redirects) returned $status, expected 200"
            docker logs anidex-smoke
            exit 1
          fi
          if ! grep -q 'id="library-search"' /tmp/home.html; then
            echo "Post-login redirect doesn't look like a rendered library page — login or an authenticated TemplateResponse route may be broken"
            cat /tmp/home.html
            docker logs anidex-smoke
            exit 1
          fi
          echo "Authenticated GET / rendered correctly."

          csrf=$(grep -o 'name="csrf-token" content="[^"]*"' /tmp/home.html | sed 's/.*content="//;s/"$//')
          status=$(curl -sL -c "$cookiejar" -b "$cookiejar" -o /dev/null -w '%{http_code}' \
            -d "timezone=Europe/London" -d "language=en" -d "theme=dark" -d "csrf_token=$csrf" \
            http://localhost:8888/settings/display)
          if [ "$status" != "200" ]; then
            echo "POST /settings/display (following redirects) returned $status, expected 200"
            docker logs anidex-smoke
            exit 1
          fi

          # Confirms the write actually landed, not just that the route returned a
          # plausible-looking redirect.
          written=$(PGPASSWORD=anidex_test psql -h localhost -U anidex_test -d anidex_test -tA -c \
            "SELECT value FROM settings WHERE key = 'theme' AND user_id = (SELECT id FROM users WHERE email = 'smoketest@ci.local')")
          if [ "$written" != "dark" ]; then
            echo "POST /settings/display didn't persist — settings.theme was '$written', expected 'dark'"
            docker logs anidex-smoke
            exit 1
          fi
          echo "Smoke test passed: authenticated route rendered correctly and a real POST write was persisted."

      - name: Container logs
        if: always()
        run: docker logs anidex-smoke || true

      - name: Clean up
        if: always()
        run: docker rm -f anidex-smoke || true
