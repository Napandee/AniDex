name: Validate PR build

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'compose/**'
      - '**.md'
      - '.claude/**'
      - '.github/dependabot.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: anidex_test
          POSTGRES_USER: anidex_test
          POSTGRES_PASSWORD: anidex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anidex_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      # Non-blocking reminder, not a gate — issue #380. Schema migrations in this
      # repo are a deliberate manual step (CLAUDE.md's "Schema migrations are
      # manual" guardrail), never auto-applied by the deploy pipeline, so a merged
      # PR that adds one can silently sit unapplied on production with nobody
      # aware — confirmed live (2026-08-27): migrations/028_plex_sync_state.sql
      # went unnoticed for a while this way. This can't catch or prevent that by
      # itself (it only fires at PR time, not at merge/deploy time), but it puts
      # the reminder in front of a reviewer at the one moment a migration file is
      # actually new — Admin > Instance Health is the other, deploy-time half of
      # this issue's fix (app/main.py's LATEST_MIGRATION vs migration_state).
      - name: Flag new migration files
        run: |
          git fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          new_migrations=$(git diff --diff-filter=A --name-only "${{ github.event.pull_request.base.sha }}" HEAD -- migrations/ || true)
          if [ -n "$new_migrations" ]; then
            echo "::warning::This PR adds a database migration — it will NOT be applied automatically on deploy (schema migrations are a manual step, see CLAUDE.md). Run it against production by hand after merging (scripts/mark_migration_applied.sh <N>, or docker exec -i <postgres-container> psql ... < migrations/00N_*.sql), and bump app/main.py's LATEST_MIGRATION to match. New file(s): $(echo "$new_migrations" | tr '\n' ' ')"
          fi

      # load: true (not push) makes the image available to `docker run` in this job,
      # without touching GHCR — this is PR validation, not the deploy path.
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: anidex:pr-test

      - name: Apply schema to test database
        run: |
          PGPASSWORD=anidex_test psql -h localhost -U anidex_test -d anidex_test -f schema.sql

      # Boots the real built image against a real Postgres and hits a route that
      # actually renders via templates.TemplateResponse (GET /auth/login) — a bare
      # `docker build` success proves dependencies resolve, nothing more. See
      # CLAUDE.local.md's dependency-review lesson: the 2026-08-13 fastapi/starlette
      # outage passed CI and a manual smoke test because that manual test hit a route
      # nobody had confirmed touched Jinja. This step checks both the HTTP status and
      # the actual rendered body, so a broken TemplateResponse calling convention
      # fails the check instead of silently passing on a 200 from somewhere else.
      #
      # `-L` follows the redirect: on a fresh empty DB (as here), GET /auth/login
      # 303s to /auth/register since there's no admin yet — both templates share
      # the `auth-title` class, so the content check holds regardless of which one
      # the app lands on. Both routes render via templates.TemplateResponse
      # (app/main.py:688 and :746 respectively) — auth-title only exists in the
      # Jinja source, never in main.py, so this can't pass on hand-built HTML.
      - name: Smoke-test the built image
        run: |
          docker run -d --name anidex-smoke --network host \
            -e DATABASE_URL="postgresql://anidex_test:anidex_test@localhost:5432/anidex_test" \
            -e SESSION_SECRET_KEY="ci-smoke-test-key" \
            -e SETTINGS_ENCRYPTION_KEY="MJ9Jy26ApKWYaavzvVpYqIB8LcPSRs_hXn7PIsyC6fk=" \
            anidex:pr-test

          ok=""
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8888/auth/login; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "App never became reachable on :8888"
            docker logs anidex-smoke
            exit 1
          fi

          status=$(curl -sL -o /tmp/login.html -w '%{http_code}' http://localhost:8888/auth/login)
          if [ "$status" != "200" ]; then
            echo "GET /auth/login (following redirects) returned $status, expected 200"
            docker logs anidex-smoke
            exit 1
          fi
          if ! grep -q 'auth-title' /tmp/login.html; then
            echo "Response body doesn't match a rendered auth template — Jinja rendering may be broken"
            cat /tmp/login.html
            docker logs anidex-smoke
            exit 1
          fi
          echo "Smoke test passed: auth page rendered correctly."

      - name: Container logs
        if: always()
        run: docker logs anidex-smoke || true

      - name: Clean up
        if: always()
        run: docker rm -f anidex-smoke || true
