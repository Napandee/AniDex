name: Notify Dependabot PR

on:
  pull_request:
    types: [opened]
  workflow_dispatch: {}

jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification
        run: |
          TITLE="${{ github.event.pull_request.title || 'Test notification (manually triggered)' }}"
          URL="${{ github.event.pull_request.html_url || github.server_url }}/${{ github.repository }}"
          curl -s -w "\nHTTP %{http_code}\n" -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode parse_mode="HTML" \
            --data-urlencode text="🔔 <b>Dependabot PR needs review</b> — ${{ github.repository }}: $TITLE ($URL)"
