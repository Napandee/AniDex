<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Anime Tracker{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/style.css?v=39">
  <script src="/static/script.js?v=17" defer></script>
</head>
<body class="{% block bodyclass %}{% endblock %}">
  <header>
    <nav>
      <a href="/" class="site-name">Anime Tracker</a>
      {% block nav_extra %}
      <div class="nav-links">
        <a href="/" class="nav-link">Library</a>
        <a href="/upcoming" class="nav-link">Upcoming</a>
        <a href="/queue" class="nav-link">Queue</a>
        <a href="/recommendations" class="nav-link">Recommended</a>
        <a href="/stats" class="nav-link">Stats</a>
        <a href="/settings" class="nav-link">Settings</a>
        {% if nav_user and nav_user.is_admin %}
        <a href="/admin" class="nav-link">Admin</a>
        {% endif %}
        {% if nav_user %}
        <form method="post" action="/auth/logout" class="nav-logout-form">
          <button type="submit" class="nav-link nav-link-btn">Logout</button>
        </form>
        {% endif %}
      </div>
      <form class="nav-search-form" action="/search" method="get">
        <input class="nav-search" type="search" name="q" placeholder="Search…" autocomplete="off">
      </form>
      {% endblock %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
