<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Anime Tracker{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/style.css?v=42">
  <script src="/static/script.js?v=17" defer></script>
</head>
<body class="{% block bodyclass %}{% endblock %}">
  <header>
    <nav>
      <a href="/" class="site-name">Anime Tracker</a>
      {% block nav_extra %}
      <div class="nav-links">
        <a href="/" class="nav-link">Library</a>
        <a href="/upcoming" class="nav-link">Upcoming</a>
        <a href="/queue" class="nav-link">Queue</a>
        <a href="/recommendations" class="nav-link">Recommended</a>
        <a href="/stats" class="nav-link">Stats</a>
        <a href="/settings" class="nav-link">Settings</a>
        {% if nav_user and nav_user.is_admin %}
        <a href="/admin" class="nav-link">Admin</a>
        {% endif %}
      </div>
      <form class="nav-search-form" action="/search" method="get">
        <input class="nav-search" type="search" name="q" placeholder="Search…" autocomplete="off">
      </form>
      {% if nav_user %}
      <form method="post" action="/auth/logout" class="logout-fab-form">
        <button type="submit" class="logout-fab" title="Log out" aria-label="Log out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </form>
      {% endif %}
      {% endblock %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
