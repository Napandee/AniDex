# Sealed record stack for the static demo. Run through demo/build.sh, which
# prepares the covers, node_modules and app image first (those steps need the
# network; nothing in this file does).
#
# One network, internal: no service can reach anything outside it, and no port
# is published. The app runs with every outbound integration switched off
# (ANILIST_MOCK=1, ANIDEX_DISABLE_SCHEDULER=1); if it still tries to call out, the
# call fails here instead of reaching a real service, and the recorder fails on
# any failed request.
#
#   docker compose -f demo/compose.yml -p anidex-demo up \
#     --abort-on-container-exit --exit-code-from recorder
name: anidex-demo

networks:
  demo:
    internal: true

services:
  db:
    image: postgres:16-alpine
    networks: [demo]
    environment:
      POSTGRES_DB: anidex_demo
      POSTGRES_USER: anidex_demo
      POSTGRES_PASSWORD: demo-only-not-a-secret
    volumes:
      # schema.sql is cumulative (it already contains every migrations/ file);
      # same as compose/dev.yml and pr-validate.yml.
      - ../schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro,z
    healthcheck:
      # TCP: the init-time server listens on the Unix socket only, so this
      # passes only once schema.sql has loaded and the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U anidex_demo -d anidex_demo"]
      interval: 2s
      timeout: 3s
      retries: 30

  anidex:
    image: ${ANIDEX_DEMO_APP_IMAGE:-anidex-demo-app:local}
    build:
      context: ..
      dockerfile: Dockerfile
    networks: [demo]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://anidex_demo:demo-only-not-a-secret@db:5432/anidex_demo
      # Dev-only values, as in compose/dev.yml: the stack is thrown away after each run.
      SESSION_SECRET_KEY: demo-only-not-for-real-use
      SETTINGS_ENCRYPTION_KEY: 8CgnHDlfBgM3RQ9L0M_tjLWCtET3Cv8YdauDtn0bkfc=
      TZ: UTC
      ANILIST_MOCK: "1"
      ANIDEX_DISABLE_SCHEDULER: "1"
      HEAVY_CORES: ${HEAVY_CORES:-}
    command:
      - sh
      - -c
      - >-
        exec $${HEAVY_CORES:+taskset -c "$$HEAVY_CORES"}
        uvicorn app.main:app --host 0.0.0.0 --port 8888
    volumes:
      - ./covers:/app/app/static/demo-covers:ro,z

  recorder:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    networks: [demo]
    depends_on:
      - anidex
    working_dir: /work
    environment:
      APP_URL: http://anidex:8888
      DATABASE_URL: postgresql://anidex_demo:demo-only-not-a-secret@db:5432/anidex_demo
      OUT: /work/_site
      HEAVY_CORES: ${HEAVY_CORES:-}
    command:
      - sh
      - -c
      - exec $${HEAVY_CORES:+taskset -c "$$HEAVY_CORES"} node demo/record.mjs
    volumes:
      - ..:/work:z
