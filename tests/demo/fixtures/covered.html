<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Covered fixture</title>
<style>
  body { margin: 0; font: 16px/1.4 sans-serif; }
  #bar { position: fixed; top: 16px; right: 0; }
  #bar button { height: 48px; } /* centre clear of the notice, top part under it */
  #notice { position: sticky; top: 0; z-index: 10; height: 40px; background: #fde68a; }
</style>
</head>
<body>
<div id="notice">A notice drawn over the toolbar</div>
<div id="bar"><button type="button" class="icon">Menu</button></div>
<p>Body text.</p>
</body>
</html>
